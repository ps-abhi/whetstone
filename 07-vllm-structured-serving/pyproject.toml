[project]
name = "07-vllm-structured-serving"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "httpx>=0.28.1",
    "hydra-core>=1.3.3",
    "openai>=2.43.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "transformers>=5.12.1",
    "vllm>=0.12.0; sys_platform == 'linux'",
    "wandb>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
    pythonpath = ["src"]
